<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Minimapa">
  <meta name="description" content="Navegador GPS personal con mapas de estilo videojuego, rutas con voz y avisos de radares.">
  <title>Minimapa · Navegador</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="map" aria-label="Mapa"></div>
  <div id="flash"></div>

  <!-- Barra de búsqueda -->
  <header id="top">
    <button id="btnMenu" class="icon-btn" aria-label="Menú"></button>
    <div id="searchBox">
      <input id="q" type="search" placeholder="¿A dónde vamos?" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button id="btnClearQ" aria-label="Borrar" hidden></button>
    </div>
    <button id="btnSkin" class="icon-btn" aria-label="Estilo de mapa"></button>
  </header>
  <nav id="chips" aria-label="Categorías"></nav>

  <!-- Botones flotantes -->
  <div id="fabs">
    <button id="btnCompass" class="fab" aria-label="Orientación"></button>
    <button id="btnReport" class="fab accent" aria-label="Reportar"></button>
    <button id="btnLocate" class="fab" aria-label="Centrar en mi posición"></button>
  </div>

  <!-- HUD de conducción -->
  <div id="speedo" hidden><div id="speedVal">0</div><div id="speedUnit">km/h</div><div id="limitSign" hidden></div></div>
  <div id="streetPill" hidden></div>
  <div id="gpsStatus" hidden>SIN GPS</div>

  <div id="navTop" hidden>
    <div class="man"><div id="manIcon"></div><div id="manDist"></div></div>
    <div class="man-text"><div id="manText"></div><div id="manSign"></div></div>
  </div>
  <div id="navThen" hidden></div>

  <div id="alertCard" hidden>
    <div class="a-top"><img alt=""><div class="a-type"></div></div>
    <div class="a-row"><div class="a-dist"></div><div class="a-lim" hidden></div></div>
    <div class="a-bar"><i></i></div>
  </div>
  <div id="sectionCard" hidden>
    <div class="s-t">Tramo · velocidad media</div>
    <div class="s-avg"></div>
    <div class="s-sub"></div>
  </div>

  <div id="navBottom" hidden>
    <div class="eta">
      <div><b id="etaTime">--:--</b><span id="etaRest"></span><span id="etaDist"></span></div>
      <span id="etaTraffic"></span>
      <div class="progress"><i id="progBar"></i></div>
    </div>
    <div class="nav-actions">
      <button id="btnMute" class="icon-btn" aria-label="Silenciar"></button>
      <button id="btnOverview" class="icon-btn" aria-label="Ver ruta completa"></button>
      <button id="btnEnd" class="icon-btn danger" aria-label="Terminar"></button>
    </div>
  </div>

  <!-- Panel inferior: resultados, lugar y rutas -->
  <section id="sheet" class="sheet" hidden><div class="sheet-grip"></div><div id="sheetBody"></div></section>

  <div id="mission" hidden><div class="mission-title"></div><div class="mission-sub"></div></div>
  <div id="toast" role="status" hidden></div>

  <!-- Pantalla de inicio -->
  <div id="splash" role="button" tabindex="0">
    <img class="logo" src="icons/icon-512.png" alt="">
    <h1>MINIMAPA</h1>
    <div class="tag">Navegador GPS · Modo libre</div>
    <div class="press">Pulsa para empezar</div>
    <div class="note">Uso personal. Pon el móvil en un soporte y no lo manipules mientras conduces. Los avisos son de radares de ubicación pública.</div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
