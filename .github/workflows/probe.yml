name: Sondeo de datos
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar exclude_polygons
        run: |
          mkdir -p out
          python probe_excl.py 2>&1 | tee out/excl.txt
      - name: Publicar muestras en una rama temporal
        run: |
          cd out
          git init -q -b probe-data
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "muestras"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-data
